# -----------------------------------------------------------------------------
# hyperscale-cluster umbrella values.
#
# Each `gate`, `manager`, `worker` block is forwarded verbatim to the
# corresponding sub-chart's values. Only set the role.<x>.enabled flag
# to control whether the sub-chart renders; set sub-chart values inside
# the same block.
#
# For the full schema of each sub-chart's values, see:
#   helm/hyperscale-gate/values.yaml
#   helm/hyperscale-manager/values.yaml
#   helm/hyperscale-worker/values.yaml
# -----------------------------------------------------------------------------

gate:
  enabled: true
  cluster:
    id: "hyperscale-gates"
    datacenterId: "global"
    size: 3
  replicas: 3

manager:
  enabled: true
  cluster:
    id: "hyperscale-managers"
    datacenterId: "default"
    size: 3
    # Wire managers to the in-namespace gate cluster automatically when
    # both are enabled. Override here if your gate cluster lives in a
    # different namespace or external to the cluster.
    gateSeeds:
      - "dns://hyperscale-cluster-gate-headless.{NAMESPACE_PLACEHOLDER}.svc.cluster.local:8080"
  replicas: 3

worker:
  enabled: true
  cluster:
    id: "hyperscale-workers"
    datacenterId: "default"
    # Wire workers to the in-namespace manager cluster.
    managerSeeds:
      - "dns://hyperscale-cluster-manager-headless.{NAMESPACE_PLACEHOLDER}.svc.cluster.local:8080"
  replicas: 1
