apiVersion: v2
name: hyperscale-cluster
description: |
  Umbrella chart that composes a full hyperscale deployment for a single
  datacenter: gate cluster + manager cluster + worker fleet. Each role
  can be enabled or disabled individually via the role.*.enabled flags
  in values.yaml.

  Typical use:
    - Single-DC deployment (small/medium): one release of this umbrella
      enabling all three roles.
    - Multi-DC: one release of this umbrella per DC, each disabling the
      gate tier (the gate cluster spans regions and has its own release).
    - Worker-only auxiliary clusters: enable role.worker only, point
      cluster.managerSeeds at the canonical manager cluster.
type: application
version: 0.1.0
appVersion: "0.7.2"
kubeVersion: ">=1.27.0-0"
keywords:
  - hyperscale
  - load-testing
  - distributed
home: https://github.com/hyper-light/hyperscale
sources:
  - https://github.com/hyper-light/hyperscale
maintainers:
  - name: Hyperscale Maintainers
    url: https://github.com/hyper-light/hyperscale
dependencies:
  - name: hyperscale-gate
    version: "0.1.0"
    repository: "file://../hyperscale-gate"
    alias: gate
    condition: gate.enabled
  - name: hyperscale-manager
    version: "0.1.0"
    repository: "file://../hyperscale-manager"
    alias: manager
    condition: manager.enabled
  - name: hyperscale-worker
    version: "0.1.0"
    repository: "file://../hyperscale-worker"
    alias: worker
    condition: worker.enabled
