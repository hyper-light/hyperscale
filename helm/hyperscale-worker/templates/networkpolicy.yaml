{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hyperscale-worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperscale-worker.labels" . | nindent 4 }}
spec:
  # AD-28 connection matrix from the worker's side:
  # - Workers receive ingress from their owner manager only.
  # - Workers initiate egress to managers only.
  # - Explicitly no worker-to-worker, no worker-to-gate.
  podSelector:
    matchLabels:
      {{- include "hyperscale-worker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Manager → Worker (workflow dispatch).
    {{- with .Values.networkPolicy.managerSelectors }}
    - from:
        {{- range . }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - port: cluster
          protocol: TCP
        - port: swim
          protocol: UDP
    {{- end }}

    # Prometheus → Worker (metrics scrape).
    {{- if and .Values.observability.prometheus.serviceMonitor.enabled (gt (len .Values.networkPolicy.prometheusSelectors) 0) }}
    - from:
        {{- range .Values.networkPolicy.prometheusSelectors }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - port: metrics
          protocol: TCP
    {{- end }}

  egress:
    # Worker → Manager (AD-52 §12 registration, heartbeats, status reports).
    {{- with .Values.networkPolicy.managerSelectors }}
    - to:
        {{- range . }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - port: {{ .Values.listen.port }}
          protocol: TCP
        - port: {{ .Values.listen.swimPort }}
          protocol: UDP
    {{- end }}

    # DNS resolution. Workers may also need egress to the targets of the
    # load-test workload — that surface is operator-supplied via
    # values.extraEgress (chart does not assume which external services
    # workers hit).
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
