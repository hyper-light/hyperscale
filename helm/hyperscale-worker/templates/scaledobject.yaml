{{- if .Values.autoscaling.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "hyperscale-worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperscale-worker.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "hyperscale-worker.fullname" . }}
  minReplicaCount: {{ .Values.autoscaling.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.autoscaling.keda.maxReplicaCount }}
  pollingInterval: {{ .Values.autoscaling.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.autoscaling.keda.cooldownPeriod }}
  # Triggers are operator-supplied — typically a prometheus query against
  # manager queue depth (cluster_manager_pending_workflows from AD-52 §18).
  # Example trigger appears in the values.yaml schema; KEDA controller
  # must be installed cluster-wide.
  triggers:
    {{- toYaml .Values.autoscaling.keda.triggers | nindent 4 }}
{{- end }}
