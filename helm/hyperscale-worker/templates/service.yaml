apiVersion: v1
kind: Service
metadata:
  name: {{ include "hyperscale-worker.metricsServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperscale-worker.labels" . | nindent 4 }}
    hyperscale.io/service-kind: metrics
spec:
  type: ClusterIP
  # Workers are not addressable by anyone — managers initiate connections
  # to them via the registered advertised_address (AD-52 §12). This
  # Service exists only for Prometheus scrape.
  selector:
    {{- include "hyperscale-worker.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.listen.metricsPort }}
      targetPort: metrics
      protocol: TCP
