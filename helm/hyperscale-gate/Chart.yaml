apiVersion: v2
name: hyperscale-gate
description: |
  Hyperscale gate cluster — AD-52 control plane (global Raft).

  Deploys a StatefulSet of gate nodes that form a single Raft group via
  the AD-52 §4 bootstrap protocol and the AD-52 §5 join protocol. Gates
  accept job submissions, dispatch to manager clusters, aggregate global
  status, and host the AD-38 job ledger.

  Requires no PVCs (AD-52 §1) — restart is always a new join. Mounts
  mTLS material from a Secret (either operator-provided or rendered by
  cert-manager).
type: application
version: 0.1.0
appVersion: "0.7.2"
kubeVersion: ">=1.27.0-0"
keywords:
