{{- if .Values.observability.prometheus.rules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "hyperscale-gate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperscale-gate.labels" . | nindent 4 }}
    {{- with .Values.observability.prometheus.rules.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # Alert rules derived directly from AD-52 §16 SLOs and §18 metric names.
  # Operators tune thresholds via values overlays; the chart ships the
  # SOTA-default targets.
  groups:
    - name: hyperscale-gate.cluster
      rules:
        - alert: HyperscaleGateLeaderMissing
          # AD-52 §16: leader election should complete within seconds.
          # Sustained leader absence breaks all writes.
          expr: |
            absent(cluster_raft_term{cluster=~"{{ .Values.cluster.id }}"}) == 1
            or
            (max by (cluster) (cluster_raft_term{cluster=~"{{ .Values.cluster.id }}"})
              - min by (cluster) (cluster_raft_term{cluster=~"{{ .Values.cluster.id }}"})) > 2
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Gate cluster {{ "{{ $labels.cluster }}" }} has no stable leader"
            runbook_url: "https://github.com/hyper-light/hyperscale/blob/main/docs/runbooks/cluster-leader-missing.md"

        - alert: HyperscaleGateMembershipChangeLatencyHigh
          # AD-52 §16 SLO: p99 < 50ms intra-DC.
          expr: |
            histogram_quantile(0.99,
              sum by (cluster, le) (
                rate(cluster_membership_change_latency_seconds_bucket{cluster=~"{{ .Values.cluster.id }}"}[5m])
              )
            ) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Gate cluster {{ "{{ $labels.cluster }}" }} p99 membership-change latency over 50ms"

        - alert: HyperscaleGateDisconnectedMode
          # AD-52 §10: data plane keeps serving for ~10 min during partition.
          # Sustained disconnected mode past that threshold indicates a
          # real outage rather than a blip.
          expr: |
            max by (cluster, node_id) (cluster_disconnected_mode_active{cluster=~"{{ .Values.cluster.id }}"}) == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Gate {{ "{{ $labels.node_id }}" }} in disconnected mode > 5m"

        - alert: HyperscalePartitionDetected
          # AD-52 §18 ClusterPartitionDetected event surfacing as a metric.
          expr: |
            rate(cluster_partition_detected_total{cluster=~"{{ .Values.cluster.id }}"}[5m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Cluster partition detected in gate cluster {{ "{{ $labels.cluster }}" }}"

        - alert: HyperscaleGatePhiAccrualBreaches
          # AD-52 §8: phi-accrual threshold breaches signal an unhealthy
          # edge to a peer. Sustained breaches imply a real failure or a
          # routing problem.
          expr: |
            rate(cluster_phi_threshold_breach_total{cluster=~"{{ .Values.cluster.id }}"}[5m]) > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Sustained phi-accrual breaches in gate cluster {{ "{{ $labels.cluster }}" }}"

        - alert: HyperscaleGateRaftCommitLagging
          # AD-52 §16: follower apply should track leader within ms.
          # A follower lagging the leader by thousands of entries means
          # it can't keep up.
          expr: |
            max by (cluster, follower_id) (cluster_raft_apply_lag_entries{cluster=~"{{ .Values.cluster.id }}"}) > 5000
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Gate follower {{ "{{ $labels.follower_id }}" }} apply-lag > 5000 entries"
{{- end }}
