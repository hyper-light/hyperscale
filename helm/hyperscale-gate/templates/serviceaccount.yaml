{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hyperscale-gate.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperscale-gate.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# AD-52 §1 forbids dependence on the K8s API. This ServiceAccount has no
# RoleBinding and is not granted any access. It exists only so audit
# tooling can attribute pod identity, never as a discovery primitive.
automountServiceAccountToken: false
{{- end }}
