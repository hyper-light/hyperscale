{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hyperscale-gate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperscale-gate.labels" . | nindent 4 }}
spec:
  # Gate cluster must keep a Raft majority available during voluntary
  # disruptions (node drain, image upgrade, etc.). AD-3 / AD-52 §1.
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "hyperscale-gate.selectorLabels" . | nindent 6 }}
{{- end }}
