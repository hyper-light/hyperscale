{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hyperscale-gate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperscale-gate.labels" . | nindent 4 }}
spec:
  # AD-28 connection matrix: default-deny, then explicit allows.
  podSelector:
    matchLabels:
      {{- include "hyperscale-gate.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Gate ↔ Gate (peer cluster RPC, SWIM).
    - from:
        - podSelector:
            matchLabels:
              {{- include "hyperscale-gate.selectorLabels" . | nindent 14 }}
      ports:
        - port: cluster
          protocol: TCP
        - port: swim
          protocol: UDP

    # Manager → Gate (AD-52 §17 federation registration, gate-bound
    # heartbeats, status reports).
    {{- with .Values.networkPolicy.managerSelectors }}
    - from:
        {{- range . }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - port: cluster
          protocol: TCP
        - port: swim
          protocol: UDP
    {{- end }}

    # Client → Gate (job submission). Caller-supplied selectors.
    {{- if or (gt (len .Values.networkPolicy.clientIngress.namespaceSelectors) 0) (gt (len .Values.networkPolicy.clientIngress.ipBlocks) 0) }}
    - from:
        {{- range .Values.networkPolicy.clientIngress.namespaceSelectors }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- range .Values.networkPolicy.clientIngress.ipBlocks }}
        - ipBlock:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - port: cluster
          protocol: TCP
    {{- end }}

    # Prometheus → Gate (metrics scrape). Only when observability surface
    # is enabled and a scraper selector has been supplied.
    {{- if and .Values.observability.prometheus.serviceMonitor.enabled (gt (len .Values.networkPolicy.prometheusSelectors) 0) }}
    - from:
        {{- range .Values.networkPolicy.prometheusSelectors }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - port: metrics
          protocol: TCP
    {{- end }}

  egress:
    # Gate → Gate (intra-cluster RPC, SWIM gossip).
    - to:
        - podSelector:
            matchLabels:
              {{- include "hyperscale-gate.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.listen.port }}
          protocol: TCP
        - port: {{ .Values.listen.swimPort }}
          protocol: UDP

    # Gate → Manager (job dispatch).
    {{- with .Values.networkPolicy.managerSelectors }}
    - to:
        {{- range . }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - port: {{ .Values.listen.port }}
          protocol: TCP
        - port: {{ .Values.listen.swimPort }}
          protocol: UDP
    {{- end }}

    # DNS resolution. AD-52 §2 dns:// locators rely on the OS resolver.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
