{{- if and (eq .Values.seeds.mode "file") (gt (len .Values.seeds.fileEntries) 0) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hyperscale-gate.seedsConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperscale-gate.labels" . | nindent 4 }}
data:
  # AD-52 §2 file:// locator. The serve command parses one locator per
  # line; comments (#-prefixed) and blank lines are ignored.
  # Updates to this ConfigMap are picked up by the mtime watch without
  # pod restart per AD-52 §2.
  seeds.txt: |
    # Hyperscale gate cluster seed locators.
    # Lines are AD-52 §2 locator URIs.
    {{- range .Values.seeds.fileEntries }}
    {{ . }}
    {{- end }}
{{- end }}
