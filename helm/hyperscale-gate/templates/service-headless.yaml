apiVersion: v1
kind: Service
metadata:
  name: {{ include "hyperscale-gate.headlessServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperscale-gate.labels" . | nindent 4 }}
    hyperscale.io/service-kind: headless
spec:
  # AD-52 §4 cold bootstrap requires that every founding pod can resolve
  # the FQDNs of the others before any of them is Ready (chicken/egg).
  # publishNotReadyAddresses lifts that constraint at the DNS layer.
  publishNotReadyAddresses: true
  clusterIP: None
  selector:
    {{- include "hyperscale-gate.selectorLabels" . | nindent 4 }}
  ports:
    - name: cluster
      port: {{ .Values.listen.port }}
      targetPort: cluster
      protocol: TCP
    - name: swim
      port: {{ .Values.listen.swimPort }}
      targetPort: swim
      protocol: UDP
