{{- if eq .Values.mtls.source "secret" }}
{{- /*
operator-mounted Secret mode. The chart does NOT render the Secret itself
in this template — that would require placing private key material in
values.yaml, which is unsafe. Instead the operator creates the Secret
out-of-band; the chart only validates here that the referenced name is
set and emits a placeholder annotation that helm-secret-checker tools
can grep.

This file intentionally renders nothing in operator-mounted mode beyond
a comment, so the deployed manifest set never carries cert material.
The StatefulSet's volume mount references .Values.mtls.secret.name and
will fail at pod-start time with a clear error if the Secret is missing.
*/}}
{{- if empty .Values.mtls.secret.name -}}
{{- fail "mtls.source=\"secret\" requires mtls.secret.name to be set (the Secret must already exist in the release namespace)" -}}
{{- end }}
# mTLS Secret {{ .Values.mtls.secret.name }} (namespace {{ .Release.Namespace }})
# is mounted by the StatefulSet from an externally-managed Secret.
# This file renders no Secret resource by design — see AD-52 §3 and the
# chart README for the rationale.
{{- end }}
