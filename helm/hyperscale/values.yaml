# Hyperscale cluster topology.
#
# Every node runs one of the CLI's node commands -- `hyperscale run gate`,
# `hyperscale run manager`, `hyperscale run worker`. Gates and managers are
# StatefulSets advertising their stable pod DNS names (their peers are
# configured by them), with a volume each for durable state (job ledger,
# WAL, idempotency). Workers are a Deployment per datacenter, advertising
# their pod IPs.

image:
  # Build from this repository with docker/images/Dockerfile.source and
  # load it into the cluster (KIND: `kind load docker-image`).
  repository: hyperscale
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The cluster's DNS domain; peers are configured by their pod DNS names
# (<pod>.<service>.<namespace>.svc.<clusterDomain>).
clusterDomain: cluster.local

# The secret every node encrypts cluster traffic with
# (MERCURY_SYNC_AUTH_SECRET). Leave both empty to have the chart generate
# a random one, kept across upgrades.
clusterSecret:
  # Name of an existing Secret holding the value under `key`.
  existingSecret: ""
  key: auth-secret
  # Or the value itself (at least 16 characters).
  value: ""

# Node log level (the commands' --log-level).
logLevel: info

# Seconds a node has to boot and to shut down (the commands'
# --boot-timeout / --shutdown-timeout). Pods are given the shutdown
# budget plus `terminationGraceMargin` before they are killed.
bootTimeoutSeconds: 300
shutdownTimeoutSeconds: 60
terminationGraceMargin: 30

# Any Env setting, as an environment variable on every node
# (e.g. MANAGER_HEARTBEAT_INTERVAL: "5.0").
env: {}

gates:
  replicas: 1
  # The gate tier's datacenter id (the command's --datacenter).
  datacenter: global
  ports:
    tcp: 8431
    udp: 8441
  persistence:
    size: 1Gi
    storageClassName: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

datacenters:
  - name: dc-a
    managers:
      replicas: 3
      ports:
        tcp: 8231
        udp: 8241
      persistence:
        size: 1Gi
        storageClassName: ""
      resources: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}
    workers:
      replicas: 2
      # Executor processes per worker (the command's --workers); request
      # at least this many CPUs.
      cores: 2
      ports:
        tcp: 8111
        udp: 8121
      resources:
        requests:
          cpu: "2"
          memory: 1Gi
      nodeSelector: {}
      tolerations: []
      affinity: {}

# `helm test`: a pod in the cluster submits one workflow through the gates
# and waits for it to complete.
probe:
  # The TCP port the probe receives job updates on (UDP: port + 1).
  port: 8500
  # How long the job may take, including waiting for the cluster to
  # accept it while nodes boot.
  timeoutSeconds: 300

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
podLabels: {}
