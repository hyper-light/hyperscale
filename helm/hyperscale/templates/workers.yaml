{{- $root := . }}
{{- range $datacenter := .Values.datacenters }}
{{- $name := include "hyperscale.worker.name" (dict "root" $root "datacenter" $datacenter.name) }}
{{- $managerName := include "hyperscale.manager.name" (dict "root" $root "datacenter" $datacenter.name) }}
{{- $managers := $datacenter.managers }}
{{- $workers := $datacenter.workers }}
{{- $selector := dict "root" $root "component" "worker" "datacenter" $datacenter.name }}
{{- $managerTcp := include "hyperscale.podAddresses" (dict "root" $root "name" $managerName "replicas" $managers.replicas "port" $managers.ports.tcp) }}
---
# Datacenter {{ $datacenter.name }}'s workers. They hold no durable state, so
# each advertises its pod IP; every manager of the datacenter is a seed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "hyperscale.labels" $root | nindent 4 }}
    app.kubernetes.io/component: worker
    hyperscale.io/datacenter: {{ $datacenter.name }}
spec:
  replicas: {{ $workers.replicas }}
  selector:
    matchLabels:
      {{- include "hyperscale.componentSelectorLabels" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hyperscale.componentSelectorLabels" $selector | nindent 8 }}
        {{- with $root.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $root.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ add $root.Values.shutdownTimeoutSeconds $root.Values.terminationGraceMargin }}
      containers:
        - name: worker
          image: {{ include "hyperscale.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $root.Values.securityContext | nindent 12 }}
          workingDir: /home/hyperscale/run
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MERCURY_SYNC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "hyperscale.secretName" $root }}
                  key: {{ $root.Values.clusterSecret.key }}
            {{- range $envName, $envValue := $root.Values.env }}
            - name: {{ $envName }}
              value: {{ $envValue | quote }}
            {{- end }}
          args:
            - run
            - worker
            - --host
            - "$(POD_IP)"
            - --tcp-port
            - {{ $workers.ports.tcp | quote }}
            - --udp-port
            - {{ $workers.ports.udp | quote }}
            - --datacenter
            - {{ $datacenter.name | quote }}
            - --workers
            - {{ $workers.cores | quote }}
            - --boot-timeout
            - "{{ $root.Values.bootTimeoutSeconds }}s"
            - --shutdown-timeout
            - "{{ $root.Values.shutdownTimeoutSeconds }}s"
            - --log-level
            - {{ $root.Values.logLevel | quote }}
            - --managers
            {{- range splitList " " $managerTcp }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: tcp
              containerPort: {{ $workers.ports.tcp }}
              protocol: TCP
            - name: swim
              containerPort: {{ $workers.ports.udp }}
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: tcp
            periodSeconds: 5
          startupProbe:
            tcpSocket:
              port: tcp
            periodSeconds: 5
            failureThreshold: {{ div $root.Values.bootTimeoutSeconds 5 }}
          {{- with $workers.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: run
              mountPath: /home/hyperscale/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with $workers.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workers.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workers.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
