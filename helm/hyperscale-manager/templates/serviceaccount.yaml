{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hyperscale-manager.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperscale-manager.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# AD-52 §1 forbids dependence on the K8s API. No RoleBinding here; this
# ServiceAccount exists purely for audit attribution.
automountServiceAccountToken: false
{{- end }}
