{{- if .Values.observability.prometheus.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "hyperscale-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperscale-manager.labels" . | nindent 4 }}
    {{- with .Values.observability.prometheus.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "hyperscale-manager.selectorLabels" . | nindent 6 }}
      hyperscale.io/service-kind: admin
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      interval: {{ .Values.observability.prometheus.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.observability.prometheus.serviceMonitor.scrapeTimeout }}
      honorLabels: true
{{- end }}
