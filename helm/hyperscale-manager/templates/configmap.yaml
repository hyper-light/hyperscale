{{- if and (eq .Values.seeds.mode "file") (gt (len .Values.seeds.fileEntries) 0) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hyperscale-manager.seedsConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperscale-manager.labels" . | nindent 4 }}
data:
  seeds.txt: |
    # Hyperscale manager cluster seed locators (AD-52 §2).
    {{- range .Values.seeds.fileEntries }}
    {{ . }}
    {{- end }}
{{- end }}
