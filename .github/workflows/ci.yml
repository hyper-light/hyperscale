# Test gate.
#
# Before this existed, `release.yml` was the only workflow in the repo:
# it publishes, it runs no tests, and its `paths: [pyproject.toml]`
# trigger means a source-only pull request ran literally nothing. Every
# cold-path crash fixed in the last few days — six AttributeErrors, a
# dead completion push, a dead peer-state-sync handler, twelve phantom
# attributes — was found by hand. The suites that would have caught
# them already existed and already passed locally; nothing ran them on
# the way in.
#
# Tiers are separate jobs so a failure names itself: a red `lints` is a
# ratchet, a red `units` is behavior, a red `simulation` is a
# determinism or timing regression.
#
# Integration tests are deliberately absent — they are run by hand
# against real infrastructure.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Lets release.yml gate publication on this workflow.
  workflow_call:
  # The long simulation campaigns are too slow for every push.
  schedule:
    - cron: "0 7 * * *"

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"

jobs:
  lints:
    name: Ratchet lints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Run ratchet lints
        # These encode invariants that cannot be expressed as unit
        # tests: no raw asyncio.create_task, no direct time/random, no
        # direct disk IO, no duplicate method definitions, no phantom
        # attributes. Each fails in BOTH directions, so fixing a
        # violation without shrinking its snapshot is also an error.
        run: uv run pytest tests/simulation/lints -q

  units:
    name: Unit tier
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Run unit tests
        run: uv run pytest tests/unit/core tests/unit/distributed tests/unit/logging -q

  simulation:
    name: Deterministic simulation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Run multi-process SIM suite
        # These spawn real processes under the SimulationCoordinator's
        # GRANT/REPORT lockstep and assert on pinned simulated-time
        # bounds, so they are kept off the parallel runner: xdist would
        # let two scenarios contend for the same machine-wide lock.
        run: uv run pytest tests/unit/simulation -q

      - name: Upload simulation artifacts
        # A failed scenario writes its dump — including the seed that
        # replays the run exactly — under _artifacts/. On a hosted
        # runner that directory dies with the job, which throws away
        # the reproducer the suite exists to produce.
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: sim-artifacts
          path: tests/simulation/_artifacts/
          if-no-files-found: ignore
          retention-days: 14

  vopr:
    name: VOPR campaigns
    # Wall-clock heavy: chaos schedules, gate tiers and soak horizons.
    # Nightly and on demand, not on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Run VOPR and scenario suites
        run: uv run pytest tests/simulation --ignore=tests/simulation/lints -q

      - name: Upload VOPR artifacts
        # Same reasoning as the SIM tier, and it matters more here: a
        # nightly chaos failure is the one run nobody watched, so its
        # seed is the only way back to it.
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: vopr-artifacts
          path: tests/simulation/_artifacts/
          if-no-files-found: ignore
          retention-days: 14
