name: tests

# The suites in this repo already exist and already pass; until now
# nothing ran them automatically. `release.yml` publishes on a
# `paths: [pyproject.toml]` trigger, so a source-only pull request ran
# no check at all -- which is how six guaranteed cold-path crashes, a
# completion push that delivered nothing, and a peer-state-sync handler
# that raised on its first statement all reached main. Each was found by
# hand afterwards. This workflow is the gate that would have caught them.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, for the tiers too slow to gate a pull request on.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CLAUDE.md sets the floor at 3.12; pyproject allows >=3.11. Pinned
  # rather than matrixed so a green check means one known-good
  # interpreter -- widen to a matrix when a second version is supported
  # on purpose rather than by accident.
  PYTHON_VERSION: "3.12"

jobs:
  lints:
    # The ratchets, first and alone, because they are the cheapest
    # signal in the repo and the most load-bearing: each one makes a
    # whole bug class unable to return silently (duplicate methods,
    # phantom attributes, raw asyncio tasks, direct time/random/disk
    # access that would break deterministic replay). Seconds to run.
    name: ratchet lints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run ratchet lints
        run: uv run pytest tests/simulation/lints -q

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run unit tests
        # `tests/unit/simulation/sim` is excluded deliberately: it spawns
        # real child processes and asserts two-sided latency bounds, and
        # takes roughly an hour. It runs in the `simulation` job below.
        # Everything else under tests/unit is fast enough to gate on.
        run: >
          uv run pytest tests/unit
          --ignore=tests/unit/simulation/sim
          -q

  simulation:
    # The deterministic-simulation tiers: multi-process SIM scenarios,
    # the VOPR seed sweeps, and the chaos suite. Too slow to gate a pull
    # request (~75 minutes combined) but the highest-value suite in the
    # repo, so it runs nightly and on demand.
    #
    # Serial on purpose -- no xdist. These scenarios coordinate real
    # child processes against a virtual clock, and a seeded schedule
    # must replay byte-identically; sharding them across workers breaks
    # the property the suite exists to prove.
    name: simulation (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Multi-process SIM scenarios
        run: uv run pytest tests/unit/simulation/sim -q

      - name: VOPR and chaos sweeps
        # Runs even if the SIM tier failed: these cover different
        # ground, and a nightly that stops at the first failure hides
        # the rest of the night's signal.
        if: '!cancelled()'
        run: >
          uv run pytest
          tests/simulation/vopr
          tests/simulation/vopr_chaos
          tests/simulation/vopr_gates
          tests/simulation/vopr_mdc
          -q

      - name: Upload simulation artifacts
        # Failure diagnostics: the harness writes per-scenario dumps
        # including the seed that reproduces the run exactly. Losing
        # those to a torn-down runner wastes the reproducer.
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: simulation-artifacts
          path: tests/simulation/_artifacts/
          if-no-files-found: ignore
          retention-days: 14
